<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>ergosphere-it Sparkle example</title>
  <style>
    body { font: 14px system-ui; margin: 24px; color: #222; background: #fff; }
    @media (prefers-color-scheme: dark) { body { color: #eee; background: #1e1e1e; } }
    h1 { font-size: 20px; margin: 0 0 4px; }
    #status { margin: 16px 0 8px; }
    progress { width: 100%; }
    button { font: inherit; padding: 6px 14px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <h1 id="version">…</h1>
  <div id="bundle"></div>
  <p id="status">…</p>
  <progress id="progress" max="100" hidden></progress>
  <p>
    <button id="check">Check for updates</button>
    <button id="apply" hidden></button>
    <a id="download-page" hidden>Download the app by hand</a>
  </p>
  <script type="module" src="./main.ts"></script>
</body>
</html>
