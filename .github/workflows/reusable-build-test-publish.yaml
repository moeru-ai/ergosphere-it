name: Build, Test, and Publish

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: false
        default: false

# The callers set the permissions. A called workflow can only lower them, so the publish job gets `id-token: write`,
# which trusted publishing on npm needs, only from build-test-publish.yaml.

jobs:
  check:
    name: Run code checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Inspect Node.js
        run: |
          which node
          node --version

      - name: Install dependencies
        run: pnpm install

      - name: Spellcheck
        run: |
          pnpm run spellcheck || {
            echo "::warning title=Spellcheck failed::CSpell found spelling issues. Check the Spellcheck logs for details."
            exit 0
          }

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      # The README of @ergosphere-it/electron is a copy of the repository README. A change of README.md must update it.
      - name: Check generated docs
        run: |
          pnpm run docs:update
          git diff --exit-code -- README.md packages/electron/README.md || {
            echo "::error title=Docs are out of date::Run pnpm docs:update and commit the result."
            exit 1
          }

  # TODO: the packages support Node.js 24, and every job runs on 26. Add a job that runs the unit tests and the build
  # on Node.js 24, so a newer Node.js API fails CI.
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Check package exports
        run: pnpm run publint

      # knip loads the electron-vite configs, which import the plugins from the build output.
      - name: Find unused files and exports
        run: pnpm run knip

      - name: Run tests
        run: pnpm run test:run

  e2e:
    name: End-to-end test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      # Electron needs a display. The e2e script starts Xvfb when no display is set.
      - if: runner.os == 'Linux'
        name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Run the end-to-end test
        run: pnpm -F @ergosphere-it/tests-electron e2e

      - name: Run the end-to-end test with app.asar
        run: pnpm -F @ergosphere-it/tests-electron e2e --asar

      - name: Run the test build under electron-vite dev
        run: pnpm -F @ergosphere-it/tests-electron e2e:dev

  sparkle:
    name: Sparkle installer on macOS
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      # Builds two packaged versions, installs the older one, and installs the newer one through a Sparkle delta.
      - name: Install an update with Sparkle
        run: pnpm -F @ergosphere-it/tests-electron-sparkle e2e

  publish:
    if: inputs.publish
    name: Publish
    needs: [check, build-test, e2e, sparkle]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      # npm trusts this workflow as the publisher of every package, so pnpm publishes with an OIDC token from GitHub and
      # no npm token. The caller grants `id-token: write`.
      - name: Publish packages
        env:
          NPM_CONFIG_PROVENANCE: true
        run: pnpm run publish:lib
