catalogMode: prefer
cleanupUnusedCatalogs: true
minimumReleaseAge: 1
fetchTimeout: 600000
shellEmulator: true
trustPolicy: no-downgrade
packages:
  - packages/**
  - examples/**
  - '!**/dist/**'

allowBuilds:
  electron: true
  esbuild: true
  simple-git-hooks: true

catalog:
  '@arethetypeswrong/core': ^0.18.5
  '@moeru/eslint-config': ^0.1.0-beta.20
  '@moeru/std': ^0.1.0-beta.20
  '@types/node': ^26.2.0
  '@vitest/coverage-v8': ^5.0.0
  bumpp: ^12.2.1
  cspell: ^10.0.1
  electron: 43.4.1
  es-toolkit: ^1.51.0
  eslint: ^10.9.0
  knip: ^6.31.0
  nano-staged: ^1.0.2
  publint: ^0.3.22
  simple-git-hooks: ^2.13.1
  taze: ^19.17.1
  tsdown: ^0.22.14
  tsx: ^4.22.4
  typescript: ^6.0.3
  valibot: ^1.4.2
  vitest: ^5.0.0
